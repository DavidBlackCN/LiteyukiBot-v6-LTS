<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>X · 推文</title>
    <link rel="stylesheet" href="./css/card.css">
    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./css/twitter_card.css">
</head>
<body class="twitter-page">
    <div class="data-storage" id="data">{{ data | tojson }}</div>
    <main id="twitter-card">
        <header class="twitter-brand"><div class="brand-name"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M12 8H25L52 56H39Z M49 8H55L15 56H9Z"/></svg><div><strong>X / Twitter</strong><span>关注世界的声音</span></div></div><span id="kind" class="type-label"></span></header>
        <article class="tweet-section info-box"><header class="author"><div class="author-identity"><img id="avatar" class="author-avatar" alt="作者头像" hidden><div><h1 id="author"></h1><p id="account"></p></div></div><time id="time"></time></header><p id="body" class="tweet-body" hidden></p><section id="translation-box" class="translation" hidden><h2>机器翻译</h2><p id="translation"></p><p id="translation-note" class="translation-note"></p></section><section id="quote" class="quote-section" hidden><span class="section-label">引用推文</span><div class="quote-identity"><img id="quote-avatar" class="author-avatar" alt="引用作者头像" hidden><h2 id="quote-author"></h2></div><p id="quote-body" class="tweet-body"></p><section id="quote-translation-box" class="translation" hidden><h2>机器翻译</h2><p id="quote-translation"></p><p id="quote-translation-note" class="translation-note"></p></section><div id="quote-media" class="media-grid"></div></section><div id="media" class="media-grid"></div></article>
        <footer><p id="source"></p><span>内容来自 X · 经 Nitter 获取 · Liteyuki</span></footer>
    </main>
    <template id="image-template"><figure><img alt="推文媒体"><figcaption></figcaption></figure></template>
    <script src="./js/card.js"></script>
    <script src="./js/twitter_card.js"></script>
</body>
</html>
