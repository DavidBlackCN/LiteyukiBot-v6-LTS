<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liteyuki Statistics Ranking</title>
    <link rel="stylesheet" href="./css/card.css">
    <link rel="stylesheet" href="./css/fonts.css">
    <link rel="stylesheet" href="./css/stat_rank.css">
</head>

<body>
    <template id="row-template">
        <article class="rank-row">
            <div class="row-position"></div>
            <img src="./img/liteyuki.png" alt="avatar" class="row-icon">
            <div class="row-name"></div>
            <div class="row-count"></div>
        </article>
    </template>

    <div class="data-storage" id="data">{{ data | tojson }}</div>
    <header class="info-box rank-header">
        <div class="rank-kicker">LiteyukiBot v6 LTS</div>
        <div id="rank-title"></div>
    </header>
    <main class="info-box" id="rank-list"></main>
    <script src="./js/card.js"></script>
    <script src="./js/stat_rank.js"></script>
</body>

</html>
