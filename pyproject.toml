# PEP 621 project metadata for Liteyuki framework.
#
# [tool.nonebot] is additionally maintained for nb-cli / nonebot-plugin-orm
# maintenance commands. Normal Liteyuki runtime plugin loading remains handled
# by Liteyuki itself.
#
# 本文件主体仍用于 Liteyuki 框架元数据。
# [tool.nonebot] 仅用于 nb-cli / nonebot-plugin-orm 等维护命令，
# Liteyuki 正常运行时仍使用自身的插件加载机制。

[project]
name = "ryoun-trim"
dynamic = ["version"]
description = "A lightweight bot process management framework and application."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Eilles", email = "EillesWan@outlook.com" },
    { name = "TriM-Org.", email = "TriM-Organization@hotmail.com" },
    { name = "snowykami", email = "snowykami@outlook.com" },
    { name = "LiteyukiStudio", email = "studio@liteyuki.icu" },
]
license = { text = "汉钰律许可协议 第一版" }

dependencies = [
    "loguru~=0.7.2",
    "pydantic==2.8.2",
    "PyYAML==6.0.2",
    "toml==0.10.2",
    "watchdog==4.0.1",
    "pdm-backend==2.3.3"
]

[project.urls]
Homepage = "https://bot.liteyuki.icu"
Repository = "https://gitee.com/TriM-Organization/LiteyukiBot-TriM"
"Issue Tracker" = "https://github.com/LiteyukiStudio/LiteyukiBot/issues/new?assignees=&labels=&projects=&template=%E9%97%AE%E9%A2%98%E5%8F%8D%E9%A6%88.md&title="


[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.build]
includes = ["liteyuki/", "LICENSE", "README.md", "LICENSE.MD"]
excludes = ["tests/", "docs/", "src/"]

[tool.pdm.version]
source = "file"
path = "liteyuki/__init__.py"

[tool.nonebot]
plugin_dirs = ["src/nonebot_plugins"]

plugins = [
    "nonebot_plugin_orm",
    "nonebot_plugin_chatrecorder",
    "nonebot_plugin_wordcloud",
    "src.liteyuki_main",
]