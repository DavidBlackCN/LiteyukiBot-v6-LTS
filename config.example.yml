# LiteyukiBot v6 LTS 配置示例
# 复制为 config.yml 后按需修改；密钥请仅保存在本地配置或环境变量中。
# 以下按用途分区，配置键仍保持顶层结构；修改后建议重启 Bot。

# ==================== 一、Bot 基础设置 ====================

# Bot 昵称，可设置多个。
nickname: [Liteyuki]
# 超级用户账号列表；默认为空，请按实际需要填写。
superusers: []
# 命令前缀；默认使用斜杠。
command_start: ["/"]
# Alconna 命令使用上述命令前缀。
alconna_use_command_start: true
# 默认语言与默认交互语言。
default_language: zh-CN
default_interact_language: zh-CN

# -------------------- 网络与适配器 --------------------

# 服务监听地址与端口。
host: 127.0.0.1
port: 20247
# Satori 适配器默认关闭，其余参数使用模型默认值。
satori:
  enable: false

# -------------------- 运行与数据 --------------------

# Liteyuki 数据目录。
data_path: data/liteyuki
# 日志级别。
log_level: INFO
# 安全模式开关。
safe_mode: false
# 自动更新开关。
auto_update: false

# ==================== 二、核心插件配置 ====================

# -------------------- 帮助菜单 --------------------

# 启用图片帮助菜单；修改开关后重启。
help_menu_enabled: true
# 每页显示插件数（1–12）。
help_menu_page_size: 10
# 展示第三方 NoneBot 插件。
help_menu_show_third_party: true
# 使用现有 pypinyin 支持名称全拼和首字母搜索。
help_menu_enable_pinyin_search: true
# 隐藏权限控制明确拒绝的插件，不消耗限流额度。
help_menu_filter_access: false
# 隐藏的插件模块名；library 类型和 extra.hidden 自动隐藏。
help_menu_hidden_plugins:
  - nonebot_plugin_htmlrender
  - nonebot_plugin_apscheduler
  - nonebot_plugin_localstore
  - to_liteyuki
  - liteyuki_eventpush

# -------------------- 权限控制与限流 --------------------

# 启用访问控制；关闭后不注册拦截器，重启生效。
access_control_enabled: true
# 未配置规则的插件默认允许，保留智能回复等现有行为。
access_control_default_allow: true
# 超级用户绕过本插件的访问和限流规则。
access_control_superuser_bypass: true
# 拒绝访问时发送简短提示。
access_control_reply_on_denied: true
# 被限流时发送简短提示；同一事件最多提示一次。
access_control_reply_on_rate_limited: true
# 保护插件绕过本插件规则；权限控制插件自身始终受保护。
access_control_protected_plugins:
  - liteyuki_access_control
  - liteyuki_group_manager
# JSON 规则存储目录，勿与其他运行实例共用。
access_control_data_path: data/liteyuki_access_control

# -------------------- 群管理（OneBot V11） --------------------

# 总开关；关闭后不注册管理命令和群通知。
group_manager_enabled: true
# 新成员入群时发送欢迎消息。
group_manager_join_notice_enabled: true
# 成员退群时发送通知。
group_manager_leave_notice_enabled: true
# 入群模板，支持 {nickname}、{user_id}、{group_id}。
group_manager_join_message: "欢迎 {nickname}（{user_id}）加入本群"
# 退群模板，支持 {nickname}、{user_id}、{group_id}。
group_manager_leave_message: "{nickname}（{user_id}）离开了本群"
# 禁言命令未指定时间时使用的秒数。
group_manager_default_ban_seconds: 600
# 单次禁言允许的最大秒数（最多 30 天）。
group_manager_max_ban_seconds: 2592000
# 允许群管理员踢人；关闭后仅群主和超级用户可用。
group_manager_allow_admin_kick: true

# ==================== 三、功能插件配置 ====================

# -------------------- 公共卡片背景 --------------------

# Status、帮助菜单和天气卡主动使用；npm/rpm 管理卡不受影响，默认关闭。
# 兼容旧 status_background_*；同名新 card_background_* 显式配置优先。
card_background_enabled: false
# 背景图片地址，需直接返回图片数据，支持 HTTP 重定向。
card_background_url: ""
# 获取背景图片的超时时间，单位为秒。
card_background_timeout: 6
# 背景遮罩强度。
card_background_mask: 0.35

# -------------------- 和风天气 --------------------

# 和风天气控制台分配的 API Host。
weather_api_host: ""
# API Key；请勿将真实密钥提交到仓库。
weather_key: ""

# -------------------- 60S API 资讯与娱乐 --------------------

# 60s API 实例地址；可替换为自建或公共实例。
sixty_api_base_url: "https://60s.viki.moe"
# API 请求超时，单位秒。
sixty_api_timeout: 10
# 定时任务、随机推送及运势次数统计使用的时区。
sixty_api_timezone: "Asia/Shanghai"
# 自动推送目标 QQ 群；为空时不自动推送。
sixty_api_push_groups: []
# 主动推送使用的 Bot self_id；留空时仅在唯一 Bot 在线时发送。
sixty_api_push_bot_id: ""

# 十项手动功能开关。
sixty_api_world_enabled: true
sixty_api_ai_enabled: true
sixty_api_history_enabled: true
sixty_api_it_enabled: true
sixty_api_moyu_enabled: true
sixty_api_hitokoto_enabled: true
sixty_api_luck_enabled: true
sixty_api_fabing_enabled: true
sixty_api_kfc_enabled: true
sixty_api_dad_joke_enabled: true

# 五项日报/资讯定时群推送（默认关闭）。
sixty_api_world_push_enabled: false
sixty_api_world_push_time: "08:30"
sixty_api_ai_push_enabled: false
sixty_api_ai_push_time: "22:30"
sixty_api_history_push_enabled: false
sixty_api_history_push_time: "09:00"
sixty_api_it_push_enabled: false
sixty_api_it_push_time: "12:00"
sixty_api_moyu_push_enabled: false
sixty_api_moyu_push_time: "09:10"

# 疯狂星期四每周四推送（默认关闭）。
sixty_api_kfc_push_enabled: false
sixty_api_kfc_push_time: "17:30"
# 每位用户每天可查询运势的次数。
sixty_api_luck_daily_limit: 1

# 发病文学随机群推送；仅在时间窗口内按随机间隔安排下一次发送。
sixty_api_fabing_random_push_enabled: false
sixty_api_fabing_random_min_interval_minutes: 180
sixty_api_fabing_random_max_interval_minutes: 360
sixty_api_fabing_random_start: "08:00"
sixty_api_fabing_random_end: "22:00"
# 冷笑话随机群推送；仅在时间窗口内按随机间隔安排下一次发送。
sixty_api_dad_joke_random_push_enabled: false
sixty_api_dad_joke_random_min_interval_minutes: 180
sixty_api_dad_joke_random_max_interval_minutes: 360
sixty_api_dad_joke_random_start: "08:00"
sixty_api_dad_joke_random_end: "22:00"

# -------------------- 定时提醒（nonebot_plugin_remind） --------------------

# 私聊执行“/提醒列表”时，列出私聊及群聊中的全部提醒。
private_list_all: true
# 触发“提醒”关键词但解析失败时，向用户发送错误提示。
remind_keyword_error: true
# 可选 GLM 解析默认关闭；glm_4_model、glm_4_model_cron、glm_api_key 均留空不配置。

# -------------------- 成语游戏 --------------------

# 严格模式。
handle_strict_mode: false
# 色彩增强模式。
handle_color_enhance: false
# 允许超级用户获取答案。
handle_superuser_get_answer: true
# 仅响应明确面向 Bot 的消息。
handle_require_tome: true

# ==================== 四、旧版服务兼容配置 ====================

# 旧 Liteyuki 远程注册默认关闭。
liteyuki:
  remote_register: false
# 保留旧言论服务兼容开关，默认关闭。
yanlun_remote_enabled: false
